[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-dreame-robot"
version = "0.1.0"
description = "Home Assistant custom integration for Dreame and MOVA robotic lawn mowers, with an interactive map"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["paho-mqtt>=2.0", "pillow>=10.0"]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-homeassistant-custom-component>=0.13.201",
  "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.setuptools.package-data]
"custom_components.dreame_robot" = [
  "manifest.json",
  "services.yaml",
  "strings.json",
  "translations/*.json",
  "www/*.js",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008"]
